<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="1000" height="250" fill="#ffffff"/>

  <!-- 1 Webcam -->
  <rect x="15" y="60" width="150" height="110" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="90" y="100" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">Webcam</text>
  <text x="90" y="125" text-anchor="middle" font-size="12" fill="#1f2937">Vídeo en directo</text>
  <text x="90" y="143" text-anchor="middle" font-size="12" fill="#1f2937">del portátil (OpenCV)</text>

  <!-- 2 MediaPipe -->
  <rect x="215" y="60" width="150" height="110" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="290" y="92" text-anchor="middle" font-size="16" font-weight="bold" fill="#14532d">MediaPipe</text>
  <text x="290" y="117" text-anchor="middle" font-size="12" fill="#1f2937">HandLandmarker</text>
  <text x="290" y="135" text-anchor="middle" font-size="12" fill="#1f2937">21 puntos de la mano</text>
  <text x="290" y="153" text-anchor="middle" font-size="12" fill="#1f2937">por fotograma</text>

  <!-- 3 Lógica -->
  <rect x="415" y="60" width="150" height="110" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="490" y="92" text-anchor="middle" font-size="16" font-weight="bold" fill="#713f12">Lógica de gestos</text>
  <text x="490" y="117" text-anchor="middle" font-size="12" fill="#1f2937">Dedo estirado o no</text>
  <text x="490" y="135" text-anchor="middle" font-size="12" fill="#1f2937">Voto de 3 fotogramas</text>
  <text x="490" y="153" text-anchor="middle" font-size="12" fill="#1f2937">+ suavizado</text>

  <!-- 4 Serie -->
  <rect x="615" y="60" width="150" height="110" rx="10" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="690" y="92" text-anchor="middle" font-size="16" font-weight="bold" fill="#581c87">USB serie</text>
  <text x="690" y="117" text-anchor="middle" font-size="12" fill="#1f2937">115200 baudios</text>
  <text x="690" y="140" text-anchor="middle" font-size="14" font-family="Courier New, monospace" fill="#1f2937">10110,87\n</text>
  <text x="690" y="158" text-anchor="middle" font-size="11" fill="#4b5563">5 bits de dedos + ángulo</text>

  <!-- 5 Arduino -->
  <rect x="815" y="60" width="170" height="110" rx="10" fill="#e0f2f1" stroke="#00797a" stroke-width="2"/>
  <text x="900" y="92" text-anchor="middle" font-size="16" font-weight="bold" fill="#00595a">Arduino UNO R4</text>
  <text x="900" y="117" text-anchor="middle" font-size="12" fill="#1f2937">Interpreta la línea y</text>
  <text x="900" y="135" text-anchor="middle" font-size="12" fill="#1f2937">activa 5 LED (D2–D6)</text>
  <text x="900" y="153" text-anchor="middle" font-size="12" fill="#1f2937">y servo opcional (D9)</text>

  <!-- Flechas -->
  <line x1="165" y1="115" x2="213" y2="115" stroke="#374151" stroke-width="2.5" marker-end="url(#flecha)"/>
  <line x1="365" y1="115" x2="413" y2="115" stroke="#374151" stroke-width="2.5" marker-end="url(#flecha)"/>
  <line x1="565" y1="115" x2="613" y2="115" stroke="#374151" stroke-width="2.5" marker-end="url(#flecha)"/>
  <line x1="765" y1="115" x2="813" y2="115" stroke="#374151" stroke-width="2.5" marker-end="url(#flecha)"/>

  <!-- Etapas -->
  <text x="90" y="45" text-anchor="middle" font-size="12" fill="#6b7280">PC · Python</text>
  <text x="290" y="45" text-anchor="middle" font-size="12" fill="#6b7280">PC · Python</text>
  <text x="490" y="45" text-anchor="middle" font-size="12" fill="#6b7280">PC · Python</text>
  <text x="690" y="45" text-anchor="middle" font-size="12" fill="#6b7280">Cable USB</text>
  <text x="900" y="45" text-anchor="middle" font-size="12" fill="#6b7280">Microcontrolador</text>

  <text x="500" y="215" text-anchor="middle" font-size="13" fill="#4b5563">Todo el procesamiento de imagen se hace en el ordenador; el Arduino solo recibe órdenes por el puerto serie.</text>
</svg>
